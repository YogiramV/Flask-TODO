{% extends "base.html" %}

{% block title %}Tasks Page{% endblock %}

{% block header %}Create Tasks{% endblock %}

{% block form %}
<form action="/task/create" method="POST">
    <div class="form-group">
        <label>Task Name</label>
        <input class="form-control" type="text" name="taskname">
    </div>

    <div class="form-group">
        <label>Due Date</label>
        <input class="form-control" type="date" name="duedate">
    </div>

    <h6>STATUS</h6>
    <select name="status"class="form-select" aria-label="status">
        <option value="COMPLETED" selected>Completed</option>
        <option value="PENDING">Pending</option>
        <option value="IN-PROGRESS">In-progress</option>
    </select>
    <br><br>

    <div class="form-group">
        <label>Remarks</label>
        <input class="form-control" type="text" name="remarks">
    </div>

    {% if role != "EMPLOYEE" %}
    <h6>Assign to</h6>
    <select name="employee"class="form-select" aria-label="employee">
        {% for employee in employees%}
        <option value={{ employee[3] }} >{{ employee[1] }}</option>
        {% endfor %}
    </select>
    {% endif %}

    <button type="submit" class="btn btn-primary">Create</button>
</form>
{% endblock %}
