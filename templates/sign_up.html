{% extends "base.html" %}

{% block title %}SignUp Page{% endblock %}

{% block header %}SignUp{% endblock %}
{% block form %}

<form action="/sign-up" method="POST">
    <div class="form-group">
        <label>Name</label>
        <input class="form-control" type="text" name="name">
    </div>

    <div class="form-group">
        <label>Age</label>
        <input class="form-control" type="number" name="age">
    </div>

    <div class="form-group">
        <label>Username</label>
        <input class="form-control" type="text" name="username">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" name="password">
    </div>

    <h6>ROLE</h6>
    <select name="role"class="form-select" aria-label="status">
        <option value="EMPLOYEE" selected>EMPLOYEE</option>
        <option value="MANAGER">MANAGER</option>
    </select>

    <br><br>

    {% if managers != None %}
    <h6>Choose Manager</h6>
    <select name="manager"class="form-select" aria-label="manager">
        <option value="" selected>I am a manager</option>
        {% for manager in managers%}
        <option value={{ manager }} >{{ manager }}</option>
        {% endfor %}
    </select>
    {% endif %}

    <br><br>

    <button type="submit" class="btn btn-primary">Sign Up</button>
</form>

{% endblock %}
