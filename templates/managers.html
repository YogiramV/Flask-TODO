{% extends "base.html" %}

{% block title %}Employees Page{% endblock %}

{% block header %}Employees{% endblock %}

{% block content %}
<table class="table table-bordered table-dark">
    <tr>
        <th>NAME</th>
        <th>AGE</th>
        <th>USERNAME</th>
        <th>ACTIONS</th>
    </tr>
    {% for manager in managers %}
    <tr>
        <td>{{manager[1]}}</td>
        <td>{{manager[2]}}</td>
        <td>{{manager[3]}}</td>
        {% if role == "ADMIN"%}
        <td>
            <button onclick="location.href = 'employees/{{manager[0]}}';" type="button" class="btn btn-primary">View Employees</button>
        </td>
        {% endif %}

    </tr>
    {% endfor %}
</table>
{% endblock %}
